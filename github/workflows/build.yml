          if ! echo "803ea1330290b9b0d2c7b5570926593fdd0323a394ddb53874fe9656a11855f0  source.tar.xz" | shasum -a 256 -c - ; then
            echo "::error::This file was not pasted completely. Copy the whole of it and paste it again."
            exit 1
          fi
          mkdir conservative
          tar -xJf source.tar.xz -C conservative

      - name: Get ready to build
        shell: bash
        run: cmake -S conservative -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the plugin (the long step)
        shell: bash
        run: cmake --build build --config Release --target Conservative_AU -j 4

      - name: Make the installer
        shell: bash
        run: |
          COMPONENT="$(find build/Conservative_artefacts -type d -name Conservative.component -prune | head -n 1)"
          if [ -z "$COMPONENT" ]; then
            echo "::error::The build finished but the plugin was not found."
            exit 1
          fi
          echo "COMPONENT=$COMPONENT" >> "$GITHUB_ENV"

          # Apple Silicon only runs signed code. A local signature is enough on your own Mac.
          codesign --force --deep --sign - "$COMPONENT"
          codesign --verify --deep --strict "$COMPONENT"

          mkdir -p pkgroot pkgscripts dist
          cp -R "$COMPONENT" pkgroot/
          printf '#!/bin/sh\nkillall -9 AudioComponentRegistrar 2>/dev/null || true\nexit 0\n' > pkgscripts/postinstall
          chmod +x pkgscripts/postinstall

          # Always install to the plugin folder, even if another copy of the plugin exists on the Mac.
          PLIST_ARGS=()
          if pkgbuild --analyze --root pkgroot component.plist \
             && /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" component.plist; then
            PLIST_ARGS=(--component-plist component.plist)
          fi
          pkgbuild --root pkgroot "${PLIST_ARGS[@]}" --scripts pkgscripts \
            --identifier com.hiccupaudio.conservative.installer --version 1.0.0 \
            --install-location /Library/Audio/Plug-Ins/Components dist/Conservative-Installer.pkg

      - name: Offer the installer for download
        uses: actions/upload-artifact@v7
        with:
          name: Conservative-for-Logic
          path: dist/Conservative-Installer.pkg
          if-no-files-found: error
          retention-days: 90

      - name: Test the plugin with Apple's validator
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$COMPONENT" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -v aufx Cnsv Hicc
          {
            echo "### Conservative is ready"
            echo "Apple's validator passed. Scroll down to **Artifacts** and download **Conservative-for-Logic**."
          } >> "$GITHUB_STEP_SUMMARY"
